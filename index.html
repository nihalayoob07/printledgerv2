<!doctype html>
<html lang="en" data-theme="dawn">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#FBF8F6" />
<meta name="description" content="Price a 3D print, log the sale, bill the customer." />
<title>Print Ledger</title>

<!-- Type is inlined in the bundle: the app renders correctly with no network. -->

<!-- Paint the saved mood before first paint, so the glass never flashes. -->
<script>
  (function () {
    var CANVAS = {
      dawn: "#FBF8F6", lagoon: "#F5FAFC", blossom: "#FDF7F8",
      iris: "#F7F6FD", eclipse: "#0C0A14"
    };
    try {
      var t = localStorage.getItem("printLedger_theme_v1");
      if (!t || !CANVAS[t]) {
        t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "eclipse" : "dawn";
      }
      if (CANVAS[t]) {
        document.documentElement.dataset.theme = t;
        document.querySelector('meta[name="theme-color"]').setAttribute("content", CANVAS[t]);
        document.documentElement.style.background = CANVAS[t];
      }
    } catch (e) { /* private mode: keep the default */ }
  })();
</script>
